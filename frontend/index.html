<!doctype html>
<html lang="ko">

    <title>ArgusDesk</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud"></header>
      <main id="stage">
        <div id="scene"></div>
        <nav id="floors" aria-label="층" hidden></nav>

    <script type="module" src="./src/main.ts"></script>
