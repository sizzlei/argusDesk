<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArgusDesk</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Shown from the first paint until the centre has something to show. -->
    <div id="loading" role="status" aria-live="polite">
      <div class="loading-card">
        <svg class="loading-box" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 14 54 24.5 32 35 10 24.5Z" fill="#edc68d"/><path d="M10 24.5 32 35V56L10 45.5Z" fill="#dcab69"/><path d="M54 24.5 32 35V56L54 45.5Z" fill="#bd8a49"/><path d="M28 15.9 50 26.4 44 29.3 22 18.8Z" fill="#f8e7c9"/><text x="21" y="47" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#1f2a44" transform="skewY(25) translate(0 -10)">AD</text></svg>
        <strong>Argus Desk</strong>
        <p id="loading-text">센터 문을 여는 중</p>
        <span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
    </div>
    <div id="app">
      <header id="hud"></header>
      <main id="stage">
        <div id="scene"></div>
        <!-- the rails: what is seen on the left, what comes to me on the right -->
        <nav id="rail-left" class="rail" aria-label="층과 보기">
          <div id="floors" role="group" aria-label="층" hidden></div>
          <div class="rail-tools"></div>
          <button id="legend-toggle" class="ib" type="button" aria-expanded="false" aria-controls="legend" aria-label="범례" data-tip="범례" hidden></button>
        </nav>
        <nav id="rail-right" class="rail" aria-label="알림과 도구">
          <div class="rail-tools"></div>
          <div id="zoom" role="group" aria-label="확대와 축소">
            <button type="button" id="zoom-in" class="ib" aria-label="확대" data-tip="확대">+</button>
            <button type="button" id="zoom-fit" class="ib" aria-label="전체 보기" data-tip="전체 보기"><span id="zoom-pct">100%</span></button>
            <button type="button" id="zoom-out" class="ib" aria-label="축소" data-tip="축소">−</button>
          </div>
        </nav>
        <section id="quests" aria-label="오늘의 퀘스트" hidden></section>
        <div id="legend" hidden></div>
        <div id="tooltip" hidden></div>
        <div id="windows"></div>
        <section id="game" aria-label="기록" hidden></section>
        <section id="week" aria-label="주간 배포 일정판" hidden></section>
        <section id="notices" aria-label="알림" hidden></section>
        <section id="filters" aria-label="필터" hidden></section>
        <section id="profile" aria-label="내 상태" hidden></section>
        <section id="settings" aria-label="설정" hidden></section>
        <div id="finder" role="dialog" aria-modal="true" aria-label="상자 찾기" hidden>
          <div class="finder-box">
            <input id="finder-input" type="text" role="combobox" aria-expanded="true" aria-controls="finder-list" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="상자 찾기: 키, 제목, 요청자, 담당자, 유형" />
            <ul id="finder-list" role="listbox"></ul>
            <p class="quiet hint">↑↓ 이동 · Enter 열기 · Esc 닫기</p>
          </div>
        </div>
      </main>
      <div id="setup" hidden></div>
      <div id="toasts"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
