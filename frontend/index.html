<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArgusDesk</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud"></header>
      <main id="stage">
        <div id="scene"></div>
        <nav id="floors" aria-label="층" hidden></nav>
        <div id="zoom" role="group" aria-label="확대와 축소">
          <button type="button" id="zoom-in" aria-label="확대" title="확대">+</button>
          <button type="button" id="zoom-fit" aria-label="전체 보기" title="전체 보기"><span id="zoom-pct">100%</span></button>
          <button type="button" id="zoom-out" aria-label="축소" title="축소">−</button>
        </div>
        <button id="legend-toggle" type="button" aria-expanded="false" aria-controls="legend" hidden>범례</button>
        <div id="legend" hidden></div>
        <div id="tooltip" hidden></div>
        <div id="windows"></div>
        <section id="game" aria-label="기록" hidden></section>
        <section id="notices" aria-label="알림" hidden></section>
      </main>
      <div id="setup" hidden></div>
      <div id="toasts"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
